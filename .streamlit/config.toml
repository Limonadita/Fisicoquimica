# Guardar en el repositorio como:  .streamlit/config.toml

[theme]
# ---- FUENTES (cámbialas aquí) ----
# Texto general:
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
# Títulos y subtítulos:
headingFont = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"

# ---- COLORES DE LAS GRÁFICAS (sirven en modo claro y oscuro) ----
chartCategoricalColors = ["#d4719a", "#9c6b4e", "#7d5a8c", "#e0a35f", "#b5838d", "#604734"]

# ---- MODO CLARO: paleta Neapolitan ----
[theme.light]
primaryColor = "#16587B"
backgroundColor = "#F0ECCD"
secondaryBackgroundColor = "#F5EEDD"
textColor = "#16587B"
# Cuadros de mensaje: verde = éxito, amarillo = advertencia, azul = información, rojo = error
greenColor = "#d4719a"
greenBackgroundColor = "#f0c5d4"
greenTextColor = "#604734"
yellowColor = "#e0a35f"
yellowBackgroundColor = "#f1deb0"
yellowTextColor = "#604734"
blueColor = "#9c6b4e"
blueBackgroundColor = "#e9dcd3"
blueTextColor = "#604734"
redColor = "#b5424f"
redBackgroundColor = "#f2c4c0"
redTextColor = "#7a2e3a"

# ---- MODO OSCURO: paleta rosa oscuro ----
[theme.dark]
primaryColor = "#e5a9bf"
backgroundColor = "#241a22"
secondaryBackgroundColor = "#372d36"
textColor = "#fdd6dd"
# Cuadros de mensaje: verde = éxito, amarillo = advertencia, azul = información, rojo = error
greenColor = "#e5a9bf"
greenBackgroundColor = "#4a3342"
greenTextColor = "#fdd6dd"
yellowColor = "#e0a35f"
yellowBackgroundColor = "#4a3d2e"
yellowTextColor = "#f5dfb0"
blueColor = "#b5838d"
blueBackgroundColor = "#3d3442"
blueTextColor = "#fdd6dd"
redColor = "#e06c80"
redBackgroundColor = "#4d2a33"
redTextColor = "#ffc9d0"
